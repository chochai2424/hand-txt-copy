<svg xmlns="http://www.w3.org/2000/svg" width="860" height="760" viewBox="0 0 860 760" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="760" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="52" font-size="28" font-weight="700" fill="#1a202c">Hand gestures → commands</text>
  <text x="40" y="80" font-size="15" fill="#718096">hand-txt-copy — the cursor follows your index fingertip</text>

  <!-- ================= rows ================= -->
  <!-- symbols: extended finger = tall rounded rect; curled = short nub -->
  <defs>
    <g id="palm"><rect x="18" y="52" width="58" height="46" rx="14" fill="#f6c9a0" stroke="#c98d63" stroke-width="2"/></g>
  </defs>

  <!-- Row 1: POINT -->
  <g transform="translate(40,110)">
    <use href="#palm"/>
    <rect x="24" y="8" width="11" height="52" rx="5" fill="#f6c9a0" stroke="#c98d63" stroke-width="2"/>            <!-- index up -->
    <rect x="39" y="50" width="11" height="16" rx="5" fill="#f0b98c" stroke="#c98d63" stroke-width="2"/>
    <rect x="54" y="50" width="11" height="16" rx="5" fill="#f0b98c" stroke="#c98d63" stroke-width="2"/>
    <rect x="69" y="50" width="10" height="16" rx="5" fill="#f0b98c" stroke="#c98d63" stroke-width="2"/>
    <rect x="4" y="64" width="22" height="11" rx="5" fill="#f6c9a0" stroke="#c98d63" stroke-width="2" transform="rotate(-28 15 69)"/>
  </g>
  <text x="170" y="152" font-size="20" font-weight="700" fill="#1a202c">Point</text>
  <text x="170" y="176" font-size="14" fill="#718096">index finger only</text>
  <text x="470" y="152" font-size="22" fill="#0ea5e9">→</text>
  <text x="510" y="152" font-size="20" font-weight="600" fill="#2b6cb0">Move the cursor</text>

  <!-- Row 2: CLICK -->
  <g transform="translate(40,220)">
    <use href="#palm"/>
    <rect x="24" y="8" width="11" height="52" rx="5" fill="#f6c9a0" stroke="#c98d63" stroke-width="2"/>            <!-- index up -->
    <rect x="39" y="8" width="11" height="52" rx="5" fill="#f6c9a0" stroke="#c98d63" stroke-width="2"/>            <!-- middle up -->
    <rect x="54" y="50" width="11" height="16" rx="5" fill="#f0b98c" stroke="#c98d63" stroke-width="2"/>
    <rect x="69" y="50" width="10" height="16" rx="5" fill="#f0b98c" stroke="#c98d63" stroke-width="2"/>
    <rect x="4" y="64" width="22" height="11" rx="5" fill="#f6c9a0" stroke="#c98d63" stroke-width="2" transform="rotate(-28 15 69)"/>
  </g>
  <text x="170" y="262" font-size="20" font-weight="700" fill="#1a202c">Two fingers</text>
  <text x="170" y="286" font-size="14" fill="#718096">index + middle</text>
  <text x="470" y="262" font-size="22" fill="#0ea5e9">→</text>
  <text x="510" y="262" font-size="20" font-weight="600" fill="#2b6cb0">Left click</text>

  <!-- Row 3: PINCH -->
  <g transform="translate(40,330)">
    <use href="#palm"/>
    <rect x="39" y="12" width="11" height="48" rx="5" fill="#f0b98c" stroke="#c98d63" stroke-width="2"/>
    <rect x="54" y="50" width="11" height="16" rx="5" fill="#f0b98c" stroke="#c98d63" stroke-width="2"/>
    <rect x="69" y="50" width="10" height="16" rx="5" fill="#f0b98c" stroke="#c98d63" stroke-width="2"/>
    <rect x="24" y="20" width="11" height="40" rx="5" fill="#f6c9a0" stroke="#c98d63" stroke-width="2"/>          <!-- index bent -->
    <rect x="2" y="30" width="26" height="11" rx="5" fill="#f6c9a0" stroke="#c98d63" stroke-width="2" transform="rotate(-45 15 35)"/> <!-- thumb up to meet -->
    <circle cx="29" cy="22" r="7" fill="#0ea5e9" opacity="0.85"/>                                                <!-- pinch contact -->
  </g>
  <text x="170" y="372" font-size="20" font-weight="700" fill="#1a202c">Pinch + drag</text>
  <text x="170" y="396" font-size="14" fill="#718096">thumb + index touch, then move</text>
  <text x="470" y="372" font-size="22" fill="#0ea5e9">→</text>
  <text x="510" y="372" font-size="20" font-weight="600" fill="#2b6cb0">Draw the selection box</text>

  <!-- Row 4: RELEASE -->
  <g transform="translate(40,440)">
    <use href="#palm"/>
    <rect x="24" y="8" width="11" height="52" rx="5" fill="#f6c9a0" stroke="#c98d63" stroke-width="2"/>
    <rect x="39" y="50" width="11" height="16" rx="5" fill="#f0b98c" stroke="#c98d63" stroke-width="2"/>
    <rect x="2" y="30" width="24" height="11" rx="5" fill="#f6c9a0" stroke="#c98d63" stroke-width="2" transform="rotate(-20 14 35)"/>
    <rect x="54" y="50" width="11" height="16" rx="5" fill="#f0b98c" stroke="#c98d63" stroke-width="2"/>
    <rect x="69" y="50" width="10" height="16" rx="5" fill="#f0b98c" stroke="#c98d63" stroke-width="2"/>
    <text x="90" y="30" font-size="26" fill="#0ea5e9">↗</text>
  </g>
  <text x="170" y="482" font-size="20" font-weight="700" fill="#1a202c">Release the pinch</text>
  <text x="170" y="506" font-size="14" fill="#718096">open thumb + index</text>
  <text x="470" y="482" font-size="22" fill="#0ea5e9">→</text>
  <text x="510" y="482" font-size="20" font-weight="600" fill="#2b6cb0">Copy region (image + OCR text)</text>

  <!-- Row 5: OPEN PALM -->
  <g transform="translate(40,550)">
    <use href="#palm"/>
    <rect x="24" y="8" width="11" height="52" rx="5" fill="#f6c9a0" stroke="#c98d63" stroke-width="2"/>
    <rect x="39" y="4" width="11" height="56" rx="5" fill="#f6c9a0" stroke="#c98d63" stroke-width="2"/>
    <rect x="54" y="8" width="11" height="52" rx="5" fill="#f6c9a0" stroke="#c98d63" stroke-width="2"/>
    <rect x="69" y="14" width="10" height="46" rx="5" fill="#f6c9a0" stroke="#c98d63" stroke-width="2"/>
    <rect x="0" y="58" width="24" height="11" rx="5" fill="#f6c9a0" stroke="#c98d63" stroke-width="2" transform="rotate(-42 12 63)"/>
  </g>
  <text x="170" y="592" font-size="20" font-weight="700" fill="#1a202c">Open palm</text>
  <text x="170" y="616" font-size="14" fill="#718096">all fingers extended</text>
  <text x="470" y="592" font-size="22" fill="#0ea5e9">→</text>
  <text x="510" y="592" font-size="20" font-weight="600" fill="#2b6cb0">Paste into the focused app</text>

  <!-- Row 6: FIST -->
  <g transform="translate(40,660)">
    <rect x="16" y="40" width="62" height="52" rx="16" fill="#f6c9a0" stroke="#c98d63" stroke-width="2"/>
    <rect x="24" y="44" width="11" height="14" rx="5" fill="#f0b98c" stroke="#c98d63" stroke-width="2"/>
    <rect x="39" y="44" width="11" height="14" rx="5" fill="#f0b98c" stroke="#c98d63" stroke-width="2"/>
    <rect x="54" y="44" width="11" height="14" rx="5" fill="#f0b98c" stroke="#c98d63" stroke-width="2"/>
    <rect x="16" y="60" width="30" height="12" rx="6" fill="#e6a97d" stroke="#c98d63" stroke-width="2"/>            <!-- thumb across -->
  </g>
  <text x="170" y="702" font-size="20" font-weight="700" fill="#1a202c">Fist</text>
  <text x="170" y="726" font-size="14" fill="#718096">all fingers curled</text>
  <text x="470" y="702" font-size="22" fill="#0ea5e9">→</text>
  <text x="510" y="702" font-size="20" font-weight="600" fill="#2b6cb0">Cancel / reset</text>
</svg>
